server {
        listen  80;
        listen [::]:80;

        server_name     curl.dfa.media;
        server_tokens   off;
        client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location / {
                return 301 https://curl.dfa.media$request_uri;
        }
}


server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name curl.dfa.media;
        client_max_body_size 100M;

        ssl_certificate /etc/nginx/ssl/live/curl.dfa.media/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/curl.dfa.media/privkey.pem;

        location /media/ {
                alias /media/;
                add_header Access-Control-Allow-Origin *;
                access_log off;
                expires 7d;
        }

        location /static/ {
                alias /static/;
                add_header Access-Control-Allow-Origin *;
                access_log off;
                expires 30d;
        }

        location ~ ^/(api|admin)/ {
                proxy_pass              http://backend:8000;
                proxy_http_version      1.1;
                proxy_set_header        Upgrade $http_upgrade;
                proxy_set_header        Connection "upgrade";
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location / {
                proxy_pass              http://45.9.41.12:3000;
                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        }
}